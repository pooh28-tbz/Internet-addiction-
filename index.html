  <style>
    :root {
      --bg: #FDFBF7;
      --card-bg: #FFFFFF;
      --text: #3D352E;
      --text-soft: #786C60;
      --primary: #8C6D53;
      --primary-light: #F4EBE1;
      --green: #4A7C59;
      --green-light: #EAF2EC;
      --amber: #D9822B;
      --amber-light: #FDF3E7;
      --red: #C85A54;
      --red-light: #FCEBEA;
      --border: #E8E2D9;
      --shadow: 0 4px 16px rgba(140, 109, 83, 0.08);
      --font-rounded: "Zen Maru Gothic", "Noto Sans TC", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-rounded);
      font-size: 16px;
      line-height: 1.6;
    }

    .wrap {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px 16px 60px;
    }

    header { text-align: center; margin-bottom: 20px; }
    header h1 { font-size: 26px; color: var(--primary); margin: 0 0 6px; }
    header p { margin: 0; color: var(--text-soft); font-size: 14px; }

    .role-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 14px;
      margin-top: 8px;
    }
    .role-badge.parent { background: #E6EEF8; color: #2B5B84; }
    .role-badge.child { background: #FCEBEA; color: #C85A54; }

    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }
    .stat-item {
      background: var(--bg);
      padding: 10px 4px;
      border-radius: 12px;
      border: 1px solid var(--border);
      text-align: center;
    }
    .stat-label { font-size: 12px; color: var(--text-soft); display: block; }
    .stat-val { font-size: 18px; font-weight: 700; color: var(--primary); }

    .system-tag {
      display: inline-block;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .msg-box {
      background: var(--amber-light);
      border-left: 4px solid var(--amber);
      padding: 14px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: 500;
      color: #8A4F13;
    }

    .options { display: grid; gap: 12px; }
    .opt-btn {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      text-align: left;
      font: inherit;
      color: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }
    .opt-btn:hover:not([disabled]) { border-color: var(--primary); background: var(--primary-light); }
    .opt-btn[disabled] { opacity: 0.4; cursor: not-allowed; background: #F0ECE6; }
    .opt-title { font-weight: 700; font-size: 16px; display: block; margin-bottom: 4px; }
    .opt-desc { font-size: 13px; color: var(--text-soft); }

    .btn-main {
      background: var(--primary);
      color: #fff;
      border: 0;
      border-radius: 999px;
      padding: 12px 32px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: block;
      margin: 20px auto 0;
    }
    .btn-main:hover { background: #735740; }

    .settlement-card {
      background: var(--green-light);
      border: 2px dashed var(--green);
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 20px;
    }
    .settlement-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }
    .s-item { background: #fff; padding: 8px; border-radius: 8px; text-align: center; font-size: 14px; }

    footer {
      text-align: center;
      font-size: 12px;
      color: var(--text-soft);
      margin-top: 30px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }
  </style>
</head>
